data_path: data/raw/diabetes.csv
processed_dir: data/processed
report_dir: reports/LAB2
model_path: reports/LAB2/ml_model.joblib
scaler: standard
model: sgd_regressor
loss: squared_error
penalty: elasticnet
seed: 42
chunk_size: 64
test_size: 0.20
validation_size: 0.20
epochs: 60
eta0: 0.01
alpha_grid:
  - 0.0001
  - 0.001
  - 0.01
l1_ratio_grid:
  - 0.15
  - 0.50
  - 0.90
elastic_net_max_iter: 10000
elastic_net_tol: 0.000001
bootstrap_samples: 1000
ci_level: 0.95
